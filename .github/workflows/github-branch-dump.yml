# GitHub Actionsの実行対象となったブランチ情報をログに出力します。
name: GitHub Branch Dump

on:
  push:
    branches:
      - develop/yuta/**
  workflow_dispatch:

jobs:
  branch-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump branch
        run: |
          BRANCH=${{ github.ref }}
          RESULT=$(echo "$BRANCH" | cut -d'/' -f4)
          echo "Name: $RESULT"
